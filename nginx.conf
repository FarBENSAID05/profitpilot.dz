# ═══════════════════════════════════════════════════════════════════════
#  profitpilot.dz — configuration nginx
#  Montée dans le conteneur : COPY nginx.conf /etc/nginx/conf.d/default.conf
#  Dernière révision : 2026-08-07
#
#  ── Hypothèse de déploiement, et pourquoi ──────────────────────────────
#  Le Dockerfile ne contient ni certificat ni bloc `listen 443`, et le site
#  répond pourtant en HTTPS : le TLS est donc terminé **en amont** par un
#  reverse proxy (Coolify, Traefik, Caddy, Cloudflare…). Cette configuration
#  n'écoute par conséquent que sur le port 80. Déclarer ici `listen 443 ssl`
#  avec des chemins de certificats inexistants ferait échouer le démarrage
#  du conteneur — nginx refuse de se lancer si le fichier .pem est absent.
#  Le bloc TLS est fourni commenté en fin de fichier, pour le jour où nginx
#  porterait lui-même le certificat.
#
#  ── Piège nginx sur lequel cette configuration est bâtie ───────────────
#  `add_header` ne s'hérite du niveau parent que si le bloc enfant n'en
#  déclare AUCUN. Poser un seul `add_header Cache-Control` dans `location /`
#  suffirait à supprimer silencieusement tous les en-têtes de sécurité sur
#  les pages HTML — l'erreur la plus répandue dans les configurations
#  recopiées. D'où le parti pris ici : la durée de cache passe par la
#  directive `expires` (qui n'entre pas en conflit avec l'héritage), pilotée
#  par une table `map` sur le type MIME, et `add_header` n'apparaît qu'une
#  seule fois, au niveau `server`.
# ═══════════════════════════════════════════════════════════════════════

# ── Négociation WebP ───────────────────────────────────────────────────
# Sert la variante .webp aux navigateurs qui l'acceptent, sans modifier une
# seule balise <img> dans les 196 pages. Les navigateurs anciens et les
# robots sociaux qui n'annoncent pas image/webp reçoivent le PNG ou le JPEG.
map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

# ── Durée de cache par type de contenu ─────────────────────────────────
map $sent_http_content_type $cache_ttl {
    default                       1h;
    ~*text/html                   10m;   # le contenu évolue
    ~*text/css                    1y;    # versionné par ?v=<hash> dans le HTML
    ~*application/javascript      1y;    # idem
    ~*^image/                     30d;
    ~*^font/                      1y;
    ~*application/xml             10m;   # sitemap : jamais de cache long
    ~*text/plain                  10m;   # robots.txt, llms.txt
    ~*application/manifest\+json  1d;
}

# ── Faut-il rediriger vers l'apex en HTTPS ? ───────────────────────────
# Le proxy transmet le nom d'hôte demandé et le protocole d'origine. On ne
# redirige que si l'un des deux n'est pas canonique — sinon on boucle.
map "$host:$http_x_forwarded_proto" $needs_canonical_redirect {
    default                        0;
    "~^www\."                      1;   # www.profitpilot.dz → profitpilot.dz
    "~:http$"                      1;   # http → https
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name profitpilot.dz www.profitpilot.dz _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json;

    # Journaliser la vraie adresse du visiteur, pas celle du proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # ── Une page = une URL ─────────────────────────────────────────────
    # Si le proxy fait déjà ces deux redirections, cette règle ne se
    # déclenche jamais : elle ne coûte rien et couvre le cas contraire.
    if ($needs_canonical_redirect) {
        return 301 https://profitpilot.dz$request_uri;
    }

    # ── Compression ────────────────────────────────────────────────────
    # Les pages font 30 à 120 Ko d'un HTML très répétitif (JSON-LD, nav,
    # pied de page) : la compression y divise le poids par cinq ou six.
    # `llms-full.txt` (750 Ko de texte brut) tombe sous les 200 Ko.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/ld+json
        application/xml application/xml+rss application/manifest+json
        image/svg+xml font/ttf font/otf;

    # Brotli si le module est présent. nginx:alpine ne l'embarque pas par
    # défaut : installer nginx-mod-http-brotli, puis décommenter.
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/javascript
    #                   application/json application/ld+json image/svg+xml;

    # ── Cache — piloté par la table `map` ci-dessus ────────────────────
    expires $cache_ttl;

    # ── En-têtes, déclarés une seule fois, ici ─────────────────────────
    # `always` les applique aussi aux réponses d'erreur (404) et aux 301.
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # HSTS : à ne poser que si le proxy sert bien tout le domaine en HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # La réponse d'une image dépend de l'en-tête Accept : sans Vary, un
    # cache intermédiaire servirait du WebP à un client qui n'en veut pas.
    add_header Vary                      "Accept"                          always;

    # ── Icônes du manifeste PWA ────────────────────────────────────────
    # Exclues de la négociation WebP : un installeur d'application attend
    # exactement l'octet PNG annoncé dans site.webmanifest.
    location ~* ^/images/(icon-|apple-touch-icon|favicon) {
        access_log off;
    }

    # ── Autres images : WebP transparent ───────────────────────────────
    location ~* ^/images/.+\.(png|jpe?g)$ {
        access_log off;
        try_files $uri$webp_suffix $uri =404;
    }

    location ~* \.(webp|svg|ico|woff2?|ttf|otf)$ {
        access_log off;
    }

    # ── Fichiers destinés aux robots ───────────────────────────────────
    # Servis en texte brut et sans cache long : un sitemap ou un llms.txt
    # figé une journée retarde d'autant la prise en compte d'une publication.
    location = /robots.txt    { default_type "text/plain; charset=utf-8"; }
    location = /llms.txt      { default_type "text/plain; charset=utf-8"; }
    location = /llms-full.txt { default_type "text/plain; charset=utf-8"; }
    location = /sitemap.xml   { default_type "application/xml; charset=utf-8"; }

    # ── Anciennes URL : 301 côté serveur ───────────────────────────────
    # Ces chemins existaient avant la réorganisation en /services/ et /fr/.
    # Ils étaient traités par une page HTML de redirection JavaScript : un
    # robot qui n'exécute pas JavaScript ne suivait donc rien, et
    # l'antériorité de l'URL restait bloquée sur une page vide. Un 301
    # serveur, lui, la transmet à la page de destination.
    location = /conseil-financier.html { return 301 /services/conseil-financier.html; }
    location = /dossier-bancaire.html  { return 301 /services/dossier-bancaire.html;  }
    location = /etude-faisabilite.html { return 301 /services/etude-faisabilite.html; }
    location = /pages/about.html       { return 301 /fr/a-propos.html;     }
    location = /pages/services.html    { return 301 /fr/services.html;     }
    location = /pages/contact.html     { return 301 /fr/contact.html;      }
    location = /pages/blog.html        { return 301 /fr/blog.html;         }
    location = /pages/portfolio.html   { return 301 /fr/realisations.html; }

    # ── Pages ──────────────────────────────────────────────────────────
    location / {
        # /guides → /guides/index.html ; /fr → /fr/index.html ;
        # /blog/business-plan-algerie → …-algerie.html
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # ── Erreurs ────────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ── Ce qui ne doit jamais sortir ───────────────────────────────────
    # Le dépôt Git est présent dans public_html : sans cette règle,
    # /.git/config est téléchargeable — et avec lui tout l'historique.
    location ~ /\.(git|env|svn)      { deny all; return 404; }
    location ~* \.(rar|zip|bak|sql)$ { deny all; return 404; }
}

